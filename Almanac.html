<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>The Labyrinth</title>
    <link rel="icon" type="image/x-icon"
          href="https://github.com/Grumbletok/The-Labyrinth/blob/main/Townsfolk/Ratcatcher/image.png?raw=true">

    <style>
        body {
            padding: 0;
            background-image: url("_images/Background.webp");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
            background-size: cover;
            -moz-background-size: cover;
            -webkit-background-size: cover;
            -o-background-size: cover;
        }

        #almanac {
            width: min(950px, 100%);
            margin-left: auto;
            margin-right: auto;
            display: grid;
            z-index: 10;
        }

        #almanac-background {
            width: min(950px, 100%);
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            z-index: -1;
            margin-top: -10px;
        }

        @media (max-width: 950px) {
            #almanac-background {
                left: 0;
                margin-left: calc(calc(100% - 950px) / 2);
                transform: none;
            }
        }

        #almanac-content {
            width: min(600px, calc(100% - 20px));
            margin-left: auto;
            margin-right: auto;
            display: grid;

            padding: 10px;

            grid-area: 1 / 1;
        }

        #almanac-content * {
            z-index: 10;
        }

        #logo {
            width: min(300px, 100%);
            height: auto;
            margin-left: auto;
            margin-right: auto;
            display: block;
            margin-top: 0;
            padding-top: 50px
        }

        .character {
            display: grid;
            grid-template-columns: 1fr 2fr;
            column-gap: 0;
        }

        h3 {
            padding-top: 0.5em;
            margin-top: 0;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .token > img {
            max-width: 100%;
            max-height: 100%;
        }

        .token > h3 {
            padding-top: 0;
            margin-top: 0;
            padding-bottom: 0.5em;
        }

        .ability > h3 {
            padding-top: 10px;
            text-align: left;
            margin-bottom: -1em;
        }

        .flavor {
            padding-top: 5px;
            font-style: italic;
            font-size: smaller;
        }

        .glossary {
            padding-bottom: 0.5em;
        }

        .character-type {
            position: sticky;
            top: 0;
            align-self: flex-start;
            margin-bottom: auto;
            white-space: nowrap;
            padding-right: 5px;
        }
    </style>
</head>
<body>
<div id="almanac-background">
    <img src="_images/AlmanacBackground.webp">
</div>
<div id="almanac">
    <div id="almanac-content">
        <img src="_images/Logo.png" id="logo">
        <div style="text-align: center; margin-left: -13px">by</div>
        <div id="author" style="text-align: center"></div>
        <br><br>
        <div id="description"></div>
        <br><br>

        <div style="display: flex; position: relative; padding-top: 20px">
            <!-- Sticky Left Label -->
            <div class="character-type">
                <img src="_images/Townsfolk.webp">
            </div>

            <!-- Scrollable Content -->
            <div id="townsfolk"></div>
        </div>

        <div style="display: flex; position: relative; padding-top: 20px">
            <!-- Sticky Left Label -->
            <div class="character-type">
                <img src="_images/Outsider.webp">
            </div>

            <!-- Scrollable Content -->
            <div id="outsider"></div>
        </div>

        <div style="display: flex; position: relative; padding-top: 20px">
            <!-- Sticky Left Label -->
            <div class="character-type">
                <img src="_images/Minion.webp">
            </div>

            <!-- Scrollable Content -->
            <div id="minion"></div>
        </div>

        <div style="display: flex; position: relative; padding-top: 20px">
            <!-- Sticky Left Label -->
            <div class="character-type">
                <img src="_images/Demon.webp">
            </div>

            <!-- Scrollable Content -->
            <div id="demon"></div>
        </div>

        <div style="display: flex; position: relative; padding-top: 20px">
            <!-- Sticky Left Label -->
            <div class="character-type">
                <img src="_images/Traveller.webp">
            </div>

            <!-- Scrollable Content -->
            <div id="traveller"></div>
        </div>

        <div style="/*display: flex*/display: none; position: relative; padding-top: 20px">
            <!-- Sticky Left Label -->
            <div class="character-type">
                <img src="_images/Fabled.webp">
            </div>

            <!-- Scrollable Content -->
            <div id="fabled"></div>
        </div>

        <script>
            fetch("The-Labyrinth.json")
                .then(value => value.text())
                .then(value => JSON.parse(value))
                .then(value => {
                    let meta = {};
                    for (const key of value) {
                        if (key.id === '_meta') {
                            meta = key;
                        }
                    }

                    document.getElementById("author").innerHTML = meta.author;
                    if (meta.description !== undefined) {
                        document.getElementById("description").innerHTML = meta.description.replaceAll("\n\n", "<br><br>").replace("\n", " ");
                    }
                    // document.getElementById("logo").src = meta.logo;

                    return value;
                })
                .then(value => {
                    const result = {};
                    for (const key of value) {
                        if (key["team"] !== undefined && key.ability !== ' ') {
                            if (result[key.team] === undefined) {
                                result[key.team] = [];
                            }
                            result[key.team].push(key);
                        }
                    }

                    for (const key in result) {
                        const elements = result[key];
                        const htmlElement = document.getElementById(key);
                        let html = "";
                        for (const data of elements) {
                            html += "<div class='character'><div class='token'><img src='" + data.image[0] + "'></div><div class='ability'><h3>" + data.name + "</h3><br>" + data.ability;
                            if (data.flavor !== undefined) {
                                html += "<div class='flavor'>" + data.flavor + "</div>";
                            }
                            html += "</div></div>";
                        }
                        htmlElement.innerHTML = html;
                    }

                    return value;
                });
        </script>
    </div>
</div>
</body>
</html>
